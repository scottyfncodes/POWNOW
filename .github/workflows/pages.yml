name: Deploy to GitHub Pages

# Publishes whatever is on the repository's default branch. Written against
# `github.event.repository.default_branch` rather than a hard-coded branch name
# so that renaming the branch — or merging this work into `main` later — does
# not silently stop the deploys.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling
# it half-published.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A red suite should never reach the published site.
      - run: npm test

      - uses: actions/configure-pages@v5

      - run: npm run build
        env:
          # Project sites live under /<repo>/ — see vite.config.ts.
          VITE_BASE_PATH: /SNOWNOW/
          # Live mode: real Open-Meteo weather + NWS alerts (keyless, called
          # directly from the browser); traffic (Google Routes), road
          # conditions (CDOT) and measured snowpack (SNOTEL) via the deployed
          # proxy in server/. The proxy's own env (keys, CORS_ORIGIN) is set
          # on Render, not here — see .env.example. None of this is a secret.
          VITE_DATA_MODE: live
          VITE_API_BASE_URL: https://snownow-traffic-proxy.onrender.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
